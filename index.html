<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Случайный факт</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #222;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 500px;
            box-shadow: 0 0 30px #000;
        }

        h1 {
            color: #ffd000;
        }

        #fact {
            font-size: 22px;
            margin: 30px 0;
        }

        button {
            background: #ffd000;
            border: none;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #ffea70;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🧠 СЛУЧАЙНЫЙ ФАКТ</h1>

        <p id="fact">
            Нажми на кнопку, чтобы узнать факт!
        </p>

        <button onclick="newFact()">🎲 Новый факт</button>
    </div>

    <script>
        const facts = [
            "У осьминога три сердца.",
            "Банан — это ягода с точки зрения ботаники.",
            "Мёд может храниться очень долго.",
            "У улиток могут быть тысячи зубов.",
            "На Венере день длиннее года.",
            "Акулы появились на Земле раньше деревьев.",
            "Сердце синего кита может весить сотни килограммов.",
            "Некоторые черепахи могут дышать через кожу."
        ];

        function newFact() {
            const random = Math.floor(Math.random() * facts.length);
            document.getElementById("fact").textContent = facts[random];
        }
    </script>

</body>
</html>
